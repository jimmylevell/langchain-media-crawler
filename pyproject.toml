[project]
name = "akquise-scanner"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "azure-ai-projects>=2.8.0",
    "azure-identity>=1.26.0",
    "httpx>=0.28.1",
    "langchain>=1.4.6",
    "langchain-azure-ai[hosting,opentelemetry]>=1.2.9",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.15",
    "lxml>=6.1.3,<7",  # <7: stay off the 7.0 beta that prerelease=allow would pick
    "python-dotenv>=1.2.4",
    "trafilatura>=2.3.1",
]

[tool.uv]
# The Foundry hosting adapter (langchain-azure-ai[hosting]) depends on several Azure and
# OpenTelemetry packages that are only published as pre-releases.
prerelease = "allow"
