[project]
name = "akquise-scanner"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "azure-ai-projects>=2.8.0",
    "azure-identity>=1.26.0",
    "ddgs>=9.16.0",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "langchain>=1.4.3",
    "langchain-azure-ai[hosting]>=1.2.9",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.14",
    "lxml>=6.1.3,<7",  # <7: stay off the 7.0 beta that prerelease=allow would pick
    "markdown>=3.11",
    "python-dotenv>=1.2.4",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
# The Foundry hosting adapter (langchain-azure-ai[hosting]) depends on several Azure and
# OpenTelemetry packages that are only published as pre-releases.
prerelease = "allow"
